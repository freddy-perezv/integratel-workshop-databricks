# ============================================================================
# Integratel · Workshop "Retener sin multas"
# Declarative Automation Bundle: TODO el proyecto como código, desplegable a dev y prod.
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run pipeline_sql -t dev
# En CI/CD (GitHub Actions) los mismos comandos corren como service principal.
# ============================================================================
bundle:
  name: integratel-retencion

include:
  - resources/*.yml

# La App se compila antes de desplegar (app/dist y app/client/dist están en .gitignore
# pero SÍ deben subirse al workspace).
sync:
  include:
    - app/dist/**
    - app/client/dist/**
    - app/app.yaml
  exclude:
    - app/node_modules/**
    - app/.env
    - knowledge/src/**
    - .venv/**

variables:
  catalog:
    description: Catálogo de Unity Catalog del entorno (integratel_dev | integratel_prod)
  warehouse_id:
    description: SQL Warehouse que ejecuta el pipeline, el dashboard y la alerta
    lookup:
      warehouse: Serverless Starter Warehouse
  cicd_sp:
    description: Application ID del service principal de CI/CD (sp-integratel-cicd)
    default: e596241d-5638-4822-af09-1adae5b2fc62
  lakebase_branch:
    description: Rama de Lakebase de la App (cada entorno tiene su propia rama de base de datos)
    default: dev
  notificaciones:
    description: Correo que recibe fallas del pipeline y alertas
    default: freddyalan.perezvelazquez@databricks.com

# Quién administra lo que despliega el Bundle y con qué identidad corren el job y la alerta:
# se define por target. En dev/prod (workspace del workshop) todo es del service principal
# de CI/CD; en `integratel` (workspace del cliente) corre como quien despliega.
# La App, el dashboard y Genie agregan además permisos de uso para todos los usuarios.
targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405608876622599.19.azuredatabricks.net
      root_path: /Workspace/Shared/integratel-workshop/.bundle/${bundle.target}
    variables:
      catalog: integratel_dev
    presets:
      name_prefix: "[dev] "
      tags:
        entorno: dev
    permissions: &permisos_cicd
      - service_principal_name: ${var.cicd_sp}
        level: CAN_MANAGE
      - user_name: freddyalan.perezvelazquez@databricks.com
        level: CAN_MANAGE
    resources: &run_as_cicd
      jobs:
        pipeline_sql:
          run_as:
            service_principal_name: ${var.cicd_sp}
      alerts:
        incidencia_masiva:
          run_as:
            service_principal_name: ${var.cicd_sp}

  prod:
    mode: production
    workspace:
      host: https://adb-7405608876622599.19.azuredatabricks.net
      root_path: /Workspace/Shared/integratel-workshop/.bundle/${bundle.target}
    variables:
      catalog: integratel_prod
      lakebase_branch: production
    presets:
      tags:
        entorno: prod
    permissions: *permisos_cicd
    resources: *run_as_cicd

  # Workspace propio del cliente (despliegue compartido del workshop, lo hace su admin).
  # Sin host fijo: usa el profile con el que se autentica (-p <profile>). Mismo catálogo
  # `integratel_prod` para que los SQL de las guías funcionen sin cambios.
  #   ./tools/bootstrap_integratel.sh <profile>
  integratel:
    workspace:
      root_path: /Workspace/Shared/integratel-workshop/.bundle/${bundle.target}
    variables:
      catalog: integratel_prod
      lakebase_branch: production
      notificaciones: ${workspace.current_user.userName}
    presets:
      tags:
        entorno: integratel
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
