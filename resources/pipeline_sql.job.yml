# Pipeline SQL: bronze → silver → gold → metric views → tests de calidad.
# Corre 100% en el SQL Warehouse (Databricks SQL). El catálogo llega como parámetro,
# así el MISMO código corre en dev y en prod.
resources:
  jobs:
    pipeline_sql:
      name: Integratel · Pipeline SQL retención
      # Siempre corre como el service principal de CI/CD (dev y prod), no como la persona que despliega.
      run_as:
        service_principal_name: ${var.cicd_sp}
      description: Construye cliente 360, métricas de soporte/churn y metric views; luego valida la calidad. Si un test falla, el despliegue a prod se detiene.
      email_notifications:
        on_failure: [ "${var.notificaciones}" ]
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: bronze
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../sql/00_bronze.sql } }
        - task_key: silver
          depends_on: [ { task_key: bronze } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../sql/10_silver.sql } }
        - task_key: gold
          depends_on: [ { task_key: silver } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../sql/20_gold.sql } }
        - task_key: metric_views
          depends_on: [ { task_key: gold } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../sql/30_metric_views.sql } }
        - task_key: permisos
          depends_on: [ { task_key: metric_views } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../sql/40_permisos.sql } }
        - task_key: test_01_unicidad_cliente_360
          depends_on: [ { task_key: metric_views } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../tests/test_01_unicidad_cliente_360.sql } }
        - task_key: test_02_conteo_vs_silver
          depends_on: [ { task_key: metric_views } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../tests/test_02_conteo_vs_silver.sql } }
        - task_key: test_03_rangos_score
          depends_on: [ { task_key: metric_views } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../tests/test_03_rangos_score.sql } }
        - task_key: test_04_integridad_referencial
          depends_on: [ { task_key: metric_views } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../tests/test_04_integridad_referencial.sql } }
        - task_key: test_05_tasa_churn
          depends_on: [ { task_key: metric_views } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../tests/test_05_tasa_churn.sql } }
        - task_key: test_06_caso_dorado_rosa
          depends_on: [ { task_key: metric_views } ]
          sql_task: { warehouse_id: "${var.warehouse_id}", file: { path: ../tests/test_06_caso_dorado_rosa.sql } }
